<div class="gasto-form">
  <h2>Adicionar Gasto</h2>

  <input type="number" placeholder="Valor" [(ngModel)]="valor" />

  <select [(ngModel)]="categoria">
    <option value="">Selecione uma categoria</option>
    @for (cat of categorias; track cat) {
      <option [value]="cat">{{ cat }}</option>
    }
  </select>

  <input type="text" placeholder="Descrição (opcional)" [(ngModel)]="descricao" />

  <input type="date" [(ngModel)]="data" />

  <button (click)="adicionar()">+ Adicionar gasto</button>
</div>
